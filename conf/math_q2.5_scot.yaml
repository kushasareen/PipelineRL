defaults:
    - trial
    - _self_

actor:
  rollout_policy: pipelinerl.domains.math.generate_math_rollout
  system_prompt: Please reason step by step, and put your final answer within \boxed{}.
  task_template: |-
    {task}
environment:
  _target_: pipelinerl.domains.math.MathEnvironment
dataset_loader: pipelinerl.domains.math.load_datasets
train_dataset_names:
- open_reasoner_zero_57k
- open_reasoner_zero_extended_72k
test_dataset_names:
  - aime_2024_original
  - amc_2023
  - math_500

deepspeed_config: deepspeed_stage3_bf16_cpu_offload

max_prompt_characters: 4000

finetune:
  seq_length: 6000

vllm_config:
  vllm_kwargs:
    max_model_len: 6000

llm:
  parameters:
    max_tokens: 4000

test_llm:
  parameters:
    max_tokens: 4000


model_path: Qwen/Qwen2.5-7B

